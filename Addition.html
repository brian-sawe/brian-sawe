<!DOCTYPE html>
<html>
  <head>
    <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Addition Game</title>
    <style>
      #problem {
        font-size: 72px;
        font-weight: bold;
      }
      .incorrect {
        color: red;
      }
    </style>
  </head>
  <body>
    <div id="app"/>
    <script type="text/babel">
      class Winner extends React.Component {
        render() {
          return (
            <div className="flex flex-col items-center justify-center text-2xl font-bold text-red-500">
              You win {this.props.name}!
             </div> 
          )
        }
      }
      class Add extends React.Component {
        constructor(props) {
          super(props);
          this.state = {
            num1: 2,
            num2 : 1,
            response: "",
            incorrect: false,
            score: 0,
          }
        }
        render() {
          if (this.state.score === 3) {
            return this.renderWinner();
          }else {
            return this.renderProblem()
          }
        }
        renderProblem() {
          return (
            <div className="flex flex-col items-center justify-center h-screen bg-gray-400 text-white font-roboto">
              <div className="font-bold text-white text-4xl">Addition Game</div>
              <div className={this.state.incorrect ? "incorrect" : ""} id="problem">
                 {this.state.num1} + {this.state.num2}
              </div>
              <div>
                <input placeholder="Name"
                      style={{ border: "1px solid black" }}
                      onChange={this.updateResponse}
                      onKeyPress={this.inputKeyPress}
                      value={this.state.response}
                      className="p-2 m-2 rounded-lg bg-gray-400 text-white text-2xl"                
                />
              </div>
              <div className="text-2xl font-bold">
                Score: {this.state.score}
              </div> 
              <button className="border border-gray-400 bg-blue-500 text-2xl p-4 rounded-lg" 
              onClick={this.resetGame}
              >Reset</button>  
            </div>

          )
          
        }
        renderWinner() {
          name = "the addition game"
          return (
              <Winner name={name} />
          )
        }
        updateResponse = (event) => {
          this.setState({
            response: event.target.value
          })
        }
        inputKeyPress = (event) => {
          if (event.key === 'Enter') {
            const answer = parseInt(this.state.response)
            if (answer === this.state.num1 + this.state.num2) {
              this.setState(state => ({
                num1: Math.ceil(Math.random() * 10),
                num2: Math.ceil(Math.random() * 10),
                response: "",
                incorrect: false,
                score: state.score + 1
              }));
            }
            else {
              this.setState({
                response: "",
                incorrect: true
              })
            }
          }
        }
        resetGame = () => {
          this.setState({
            num1: 1,
            num2: 1,
            response: "",
            incorrect: false,
            score: 0
          });
        }
      }
      ReactDOM.render(<Add />, document.querySelector('#app'))

    </script>

    
  </body>
</html>
