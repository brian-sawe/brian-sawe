<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'fade-in': 'fadeIn 0.5s ease-in-out',
            'bounce': 'bounce 1s infinite',
            'shake': 'shake 0.5s ease-in-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            bounce: {
              '0%, 100%': { transform: 'translateY(-5%)' },
              '50%': { transform: 'translateY(0)' },
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '25%': { transform: 'translateX(-5px)' },
              '75%': { transform: 'translateX(5px)' },
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Rock Paper Scissors Game</title>
  <script>
    let score = JSON.parse(localStorage.getItem('score'));
    if (!score) {
      score = {
      wins: 0,
      tie: 0,
      losses: 0
      }
    }
    


    
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelector('#Rock').onclick = function () {
        PlayGame('Rock');
      };
      document.querySelector('#Paper').onclick = function () {
       PlayGame('Paper');
      };
      document.querySelector('#Scissors').onclick = function () {
        PlayGame('Scissors');
      };  
    });
    
    function pickComputerMove () {
      let RandomNumber = Math.random();
      let ComputerMove = '';
      if (RandomNumber > 0 && RandomNumber <= 1/3) {
        ComputerMove = 'Rock';

      }else if (RandomNumber > 1/3 && RandomNumber <= 2/3) {
        ComputerMove = 'Paper';
      }else if (RandomNumber > 2/3 && RandomNumber <= 1) {
        ComputerMove = 'Scissors';
      }
      return ComputerMove;

    }
    function PlayGame (PlayerMove) {
      const ComputerMove = pickComputerMove();
      
      let result = '';
      if (PlayerMove === 'Scissors') {
        if (ComputerMove === 'Rock') {
        result = 'You Lose.';
      }else if (ComputerMove === 'Paper') {
        result = 'You Win.';
      }else if (ComputerMove === 'Scissors') {
        result = 'Tie.';
      }
      }
      
      else if (PlayerMove === 'Paper') {

        if (ComputerMove === 'Rock') {
          result = 'You Win.';
        }else if (ComputerMove === 'Paper') {
          result = 'Tie.';
        }else if (ComputerMove === 'Scissors') {
          result = 'You Lose.';
        }
      }
      
      else if (PlayerMove === 'Rock') {
        if (ComputerMove === 'Rock') {
          result = 'Tie.';
        }else if (ComputerMove === 'Paper') {
          result = 'You Lose.';
        }else if (ComputerMove === 'Scissors') {
          result = 'You Win.';
        }
      }

      if (result === 'You Win.') {
        score.wins += 1;
      } else if (result === 'You Lose.') {
        score.losses += 1;
      }else if (result === 'Tie.') {
        score.tie += 1;
      }

      localStorage.setItem('score', JSON.stringify(score));

      updateScore(); 
      document.querySelector('.js-result').innerHTML = result;
      document.querySelector('.js-moves').innerHTML = `You <img src="${PlayerMove}-emoji.png" class="bg-blue-100 
      hover:bg-blue-200 rounded-full w-20 h-20 flex items-center justify-center transition-all duration-200 hover:scale-110 shadow-md"> - <img src="${ComputerMove}-emoji.png" class="bg-blue-100 hover:bg-blue-200 rounded-full 
      w-20 h-20 flex items-center justify-center transition-all duration-200 hover:scale-110 shadow-md"> Computer`;
    }
    function updateScore() {
      document.querySelector('.score').innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.tie}`;
    }
    
  </script>
</head>
<body class="bg-black text-white w-full h-200 flex flex-col items-center justify-center font-arial">
  <p class="text-3xl font-extrabold animate-fade-in">Rock Paper Scissors Game</p>
  <div class="justify-center flex space-x-4 mt-6 mb-8 animate-fade-in">
    <button id="Rock" class="bg-blue-100 hover:bg-blue-200 rounded-full w-20 h-20 flex items-center justify-center transition-all duration-200 hover:scale-110 shadow-md"><img src="rock-emoji.png"></button>
    <button id="Paper" class="bg-blue-100 hover:bg-blue-200 rounded-full w-20 h-20 flex items-center justify-center transition-all duration-200 hover:scale-110 shadow-md"><img src="paper-emoji.png"></button>
    <button id="Scissors" class="bg-blue-100 hover:bg-blue-200 rounded-full w-20 h-20 flex items-center justify-center transition-all duration-200 hover:scale-110 shadow-md"><img src="scissors-emoji.png"></button>
  </div>
  <p class="js-result text-2xl font-medium mb-8 animate-fade-in"></p>
  <p class="js-moves font-extrabold text-xl my-8 flex animate-fade-in"></p>
  <p class="score font-bold text-lg text-yellow-100 animate-fade-in"></p>
  <button onclick="
    score.tie = 0;
    score.losses = 0;
    score.wins = 0;
    updateScore();
    localStorage.removeItem('score');
  " class="bg-red-400 font-extrabold rounded-md p-2 hover:bg-red-700 shadow-md transition-all duration-200 
  hover:scale-110 mt-6 animate-fade-in">Reset Score</button>
  
</body>
</html>
